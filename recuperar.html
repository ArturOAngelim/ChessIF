
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChessIF | Recuperar senha</title>

    <link rel="stylesheet" href="recuperar.css">
</head>
<body>

    <header class="header">

        <div class="logo">
            <span class="peca">♛</span>
            <h2>CHESS<span>IF</span></h2>
        </div>

        <a href="login.html" class="voltar">Voltar ao login</a>

    </header>


    <div class="principal">

        <div class="recuperacao">

            <div class="icone">
                ♙
            </div>

            <h1>Esqueceu sua senha?</h1>

            <p class="descricao">
                Não se preocupe! Informe o e-mail cadastrado em sua conta.
                Enviaremos instruções para você redefinir sua senha.
            </p>


            <form action="#" method="post">

                <div class="campo">

                    <label for="email">E-mail cadastrado</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <a href=""><button type="submit" class="btn_enviar">
                    Enviar instruções
                </button></a>

            </form>


            <a href="login.html" class="voltar_login">
                ← Voltar para o login
            </a>

        </div>

    </div>


    <footer class="rodape">

        <p>ChessIF © 2026</p>

        <p>Desenvolvido para os amantes do xadrez.</p>

    </footer>

</body>
</html>
