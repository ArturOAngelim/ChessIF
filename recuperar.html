<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d120e">
    <title>ChessIF | Recuperar senha</title>
    <link rel="stylesheet" href="recuperar.css">
</head>
<body>

    <header class="header">
        <a href="index.html" class="logo" aria-label="ChessIF - página inicial">
            <span class="peca" aria-hidden="true">♛</span>
            <h2>CHESS<span>IF</span></h2>
        </a>
        <a href="login.html" class="voltar">Voltar ao login</a>
    </header>

    <main class="principal">
        <section class="recuperacao" aria-labelledby="titulo-recuperacao">
            <div class="icone" aria-hidden="true">♙</div>

            <h1 id="titulo-recuperacao">Esqueceu sua senha?</h1>

            <p class="descricao">
                Informe o e-mail cadastrado na sua conta ChessIF.
                Se houver uma conta associada a esse endereço, enviaremos
                um link para você criar uma nova senha.
            </p>

            <form id="form-recuperacao" novalidate>
                <div class="campo">
                    <label for="email">E-mail cadastrado</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        maxlength="254"
                        required
                    >
                </div>

                <p id="mensagem" class="mensagem" role="status" aria-live="polite"></p>

                <button type="submit" class="btn_enviar" id="btn-enviar">
                    Enviar instruções
                </button>
            </form>

            <a href="login.html" class="voltar_login">← Voltar para o login</a>
        </section>
    </main>

    <footer class="rodape">
        <p>ChessIF © 2026</p>
        <p>Desenvolvido para os amantes do xadrez.</p>
    </footer>

    <script type="module">
        import { supabase } from "./supabase.js";

        const formulario = document.getElementById("form-recuperacao");
        const campoEmail = document.getElementById("email");
        const mensagem = document.getElementById("mensagem");
        const botao = document.getElementById("btn-enviar");

        function mostrarMensagem(texto, tipo = "info") {
            mensagem.textContent = texto;
            mensagem.className = `mensagem ${tipo}`;
        }

        formulario.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = campoEmail.value.trim().toLowerCase();

            if (!campoEmail.checkValidity()) {
                campoEmail.reportValidity();
                return;
            }

            botao.disabled = true;
            botao.textContent = "Enviando...";
            mostrarMensagem("Processando sua solicitação...", "info");

            try {
                // O destino precisa estar autorizado em Authentication > URL Configuration.
                const redirectTo = new URL("nova-senha.html", window.location.href).toString();

                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo
                });

                if (error) {
                    // Não mostramos detalhes do provedor nem confirmamos se o e-mail existe.
                    mostrarMensagem(
                        "Não foi possível processar a solicitação agora. Aguarde um pouco e tente novamente.",
                        "erro"
                    );
                    return;
                }

                // Mensagem genérica para evitar enumeração de contas.
                mostrarMensagem(
                    "Se existir uma conta associada a esse e-mail, enviaremos um link de recuperação. Confira também a caixa de spam.",
                    "sucesso"
                );

                formulario.reset();

            } catch {
                mostrarMensagem(
                    "Não foi possível conectar ao serviço. Verifique sua internet e tente novamente.",
                    "erro"
                );
            } finally {
                botao.disabled = false;
                botao.textContent = "Enviar instruções";
            }
        });
    </script>

</body>
</html>
